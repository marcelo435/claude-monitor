name: Testar e empacotar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Testes
        run: npm test
      - name: Compilar desktop
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Empacotar
        run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: claude-monitor-windows
          if-no-files-found: error
          path: |
            dist/*.vsix
            dist/*.zip
            dist/SHA256SUMS.txt
